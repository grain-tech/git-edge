\* Kept world, barrier mode, no garbage: every P0 entry can be built, so
\* fallback retirement and a swap without an epoch bump are reachable. The
\* second push may be thin. Clean.
SPECIFICATION Spec
CONSTANTS
  Barrier = TRUE
  Bug = "none"
  MaxChains = 2
  DeltaCap = 1
  MaxErrs = 1
  Scope = "full"
  World = "kept"
  Garbage = FALSE
  MaxPushes = 2
INVARIANT
  TypeOK
  RefsResolvable
  LiveBytesPresent
  CommittedPushResolvable
  YoungPacksClosed
  LiveClosed
  FetchReadsSucceed
  PushBaseReadsSucceed

\* Known finding, the consequence: LiveClosed is left out so the run goes
\* on to a later push that lands ga -> a. Must violate RefsResolvable.
SPECIFICATION Spec
CONSTANTS
  Barrier = TRUE
  Bug = "none"
  MaxChains = 2
  DeltaCap = 1
  MaxErrs = 1
  Scope = "full"
  World = "split"
  MaxPushes = 2
INVARIANT
  TypeOK
  RefsResolvable
  LiveBytesPresent
  CommittedPushResolvable
  YoungPacksClosed
  FetchReadsSucceed
  PushBaseReadsSucceed

\* Statechart scope: one barrier chain, the thin push, no fetch, no
\* janitor expiry, no rebuild or orphan abort, no Err. Under 500 states.
SPECIFICATION Spec
CONSTANTS
  Barrier = TRUE
  Bug = "none"
  MaxChains = 1
  DeltaCap = 1
  MaxErrs = 0
  Scope = "chart"
  World = "single"
  Garbage = TRUE
  MaxPushes = 1
INVARIANT
  TypeOK
  RefsResolvable
  LiveBytesPresent
  CommittedPushResolvable
  YoungPacksClosed
  LiveClosed
  PushBaseReadsSucceed

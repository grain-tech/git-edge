\* Split world, barrier mode: fenced_swap may keep P1 while P0 is
\* retirable, and must then hold P0 back. Clean.
SPECIFICATION Spec
CONSTANTS
  Barrier = TRUE
  Bug = "none"
  MaxChains = 2
  DeltaCap = 1
  MaxErrs = 1
  Scope = "full"
  World = "split"
  Garbage = TRUE
  MaxPushes = 2
INVARIANT
  TypeOK
  RefsResolvable
  LiveBytesPresent
  CommittedPushResolvable
  YoungPacksClosed
  LiveClosed
  FetchReadsSucceed
  PushBaseReadsSucceed
